# =============================================================================
# Sentinel AI
# AI Digital Media Forensics Platform
#
# File        : pyproject.toml
# Purpose     : Repository-level Python tooling configuration
# Standard    : PEP 517 / PEP 518 / PEP 621
# =============================================================================

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ai-digital-media-forensics-platform"
version = "0.1.0a0"
description = "Enterprise-grade AI Digital Media Forensics Platform."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }

authors = [
    { name = "Forensix AI" }
]

keywords = [
    "artificial-intelligence",
    "digital-forensics",
    "deepfake",
    "computer-vision",
    "audio-forensics",
    "video-forensics",
    "image-forensics",
    "cybersecurity",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
]

[tool.uv]
package = false
default-groups = ["dev"]
