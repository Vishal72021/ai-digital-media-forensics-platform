# =============================================================================
# Sentinel AI
# AI Digital Media Forensics Platform
#
# File        : pyproject.toml
# Purpose     : Python project configuration
# Standard    : PEP 517 / PEP 518 / PEP 621
#
# NOTE:
# This file is the single source of truth for the Python workspace.
# Every Python development tool should be configured here whenever supported.
# =============================================================================

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ai-digital-media-forensics-platform"
version = "0.1.0a0"
description = "Enterprise-grade AI Digital Media Forensics Platform."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }

authors = [
    { name = "Forensix AI" }
]

keywords = [
    "artificial-intelligence",
    "digital-forensics",
    "deepfake",
    "computer-vision",
    "audio-forensics",
    "video-forensics",
    "image-forensics",
    "cybersecurity",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.12.0",
    "mypy>=1.17.0",
    "pre-commit>=4.2.0",
]

[tool.uv]
package = false
default-groups = ["dev"]

# -----------------------------------------------------------------------------
# Ruff
# -----------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# -----------------------------------------------------------------------------
# MyPy
# -----------------------------------------------------------------------------

[tool.mypy]
python_version = "3.13"

warn_unused_configs = true
warn_return_any = true
warn_unreachable = true

check_untyped_defs = true

disallow_untyped_defs = true
disallow_incomplete_defs = true

no_implicit_optional = true

strict_equality = true

pretty = true
show_error_codes = true
