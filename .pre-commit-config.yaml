# ==============================================================================
# Sentinel AI
# AI Digital Media Forensics Platform
#
# File: .pre-commit-config.yaml
# Purpose:
#   Repository-wide pre-commit quality gates.
#
# Documentation:
#   https://pre-commit.com/
# ==============================================================================

default_language_version:
  python: python3.13

repos:
  # ---------------------------------------------------------------------------
  # General repository hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml

      - id: check-toml

      - id: end-of-file-fixer

      - id: trailing-whitespace

      - id: check-merge-conflict

      - id: check-added-large-files
        args:
          - "--maxkb=1024"

  # ---------------------------------------------------------------------------
  # Backend Python quality gates
  #
  # These hooks intentionally execute through the backend uv environment so
  # local development, pre-commit, and CI use the same locked toolchain and
  # application dependencies.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: backend-ruff-check
        name: backend ruff check
        entry: uv run --project apps/backend ruff check --config apps/backend/pyproject.toml apps/backend --fix
        language: system
        pass_filenames: false
        files: ^apps/backend/.*\.py$

      - id: backend-ruff-format
        name: backend ruff format
        entry: uv run --project apps/backend ruff format --config apps/backend/pyproject.toml apps/backend --check
        language: system
        pass_filenames: false
        files: ^apps/backend/.*\.py$

      - id: backend-mypy
        name: backend mypy
        entry: uv run --project apps/backend mypy --config-file apps/backend/pyproject.toml apps/backend/src
        language: system
        pass_filenames: false
        files: ^apps/backend/.*\.py$
