# ==============================================================================
# Sentinel AI
# AI Digital Media Forensics Platform
#
# File: .pre-commit-config.yaml
# Purpose:
#   Repository-wide pre-commit quality gates.
#
# Documentation:
#   https://pre-commit.com/
# ==============================================================================

default_language_version:
  python: python3.13

repos:
  # ---------------------------------------------------------------------------
  # General repository hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml

      - id: check-toml

      - id: end-of-file-fixer

      - id: trailing-whitespace

      - id: check-merge-conflict

      - id: check-added-large-files
        args:
          - "--maxkb=1024"

  # ---------------------------------------------------------------------------
  # Backend Python quality gates
  #
  # Backend tooling executes with apps/backend as its working directory.
  # This guarantees that local development, pre-commit, and CI resolve the
  # same pyproject.toml, uv.lock, source roots, and tool configuration.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: backend-ruff-check
        name: backend ruff check
        entry: uv run --directory apps/backend ruff check . --fix
        language: system
        pass_filenames: false
        files: ^apps/backend/.*\.py$

      - id: backend-ruff-format
        name: backend ruff format
        entry: uv run --directory apps/backend ruff format . --check
        language: system
        pass_filenames: false
        files: ^apps/backend/.*\.py$

      - id: backend-mypy
        name: backend mypy
        entry: uv run --directory apps/backend mypy src
        language: system
        pass_filenames: false
        files: ^apps/backend/.*\.py$
